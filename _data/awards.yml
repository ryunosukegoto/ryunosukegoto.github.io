- when: 2024&ndash;
  title:
    en: Knight-Hennessy Scholar
    ja: Knight-Hennessy Scholar
  title_url: https://knight-hennessy.stanford.edu/
  where:
    en: Stanford University
  desc:
    en: A fellowship and leadership program for graduate students at Stanford. Scholars receive full funding and participate in leadership training, mentorship, and experiential learning for up to three years of their graduate study.

